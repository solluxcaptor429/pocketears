# XcodeGen spec -- the CI runner turns this into PocketEars.xcodeproj (no Mac needed here).
name: PocketEars
options:
  bundleIdPrefix: com.solluxcaptor
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PocketEars:
    type: application
    platform: iOS
    sources:
      - PocketEars
      - Shared
    dependencies:
      # Embedded into PocketEars.app/PlugIns. SideStore signs it with the app.
      - target: PocketEarsBroadcast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solluxcaptor.pocketears
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: PocketEars/Info.plist
      properties:
        CFBundleDisplayName: PocketEars
        CFBundleName: PocketEars
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: PocketEars listens to the room and turns what it hears into the LED sign's visualizer. Audio never leaves your network and is not recorded.
        NSLocalNetworkUsageDescription: PocketEars finds the LED sign on your Wi-Fi and streams the visualizer to it.

  # "Phone audio" mode: ReplayKit broadcast upload extension. iOS feeds it the audio
  # every app is playing; it analyses it and drives the sign itself.
  PocketEarsBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - PocketEarsBroadcast
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.solluxcaptor.pocketears.Broadcast
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: PocketEarsBroadcast/Info.plist
      properties:
        CFBundleDisplayName: PocketEars
        CFBundleName: PocketEarsBroadcast
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: PocketEars finds the LED sign on your Wi-Fi and streams the visualizer to it.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
